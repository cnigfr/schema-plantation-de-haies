name: Vérification du respect des spécifications

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
    - name: Cache pip
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-
    - name: Installation des dépendances
      run: pip install -r requirements.txt
    - name: Vérification du schéma classe-haie et du fichier d'exemple associé
      run: |
        frictionless validate --type schema schema/classe-haie/schema.json
        frictionless validate --schema schema/classe-haie/schema.json schema/classe-haie/exemple-valide.csv
    - name: Vérification du datapackage
      run: |
        frictionless validate datapackage.json
